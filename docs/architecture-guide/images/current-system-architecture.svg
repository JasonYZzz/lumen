      <text x="18" y="94" class="mono">轮次 · 上下文 · 工作 · Agent · 实时记录</text>
    </g>
    <g transform="translate(535 1100)">
      <rect width="220" height="115" class="node-mint"/>
      <text x="16" y="24" class="mono-mint">大载荷</text>
      <text x="16" y="52" class="node-title">ArtifactStore</text>
      <text x="16" y="75" class="mono">内容寻址</text>
      <text x="16" y="94" class="mono">转写 · 差异 · 媒体</text>
    </g>
    <g transform="translate(790 1100)">
      <rect width="220" height="115" class="node-mint"/>
      <text x="16" y="24" class="mono-mint">召回状态</text>
      <text x="16" y="52" class="node-title">MemoryManager</text>
      <text x="16" y="75" class="mono">SQLite 存储库</text>
      <text x="16" y="94" class="mono">ContextEngine 投影</text>
    </g>
    <g transform="translate(1045 1100)">
      <rect width="220" height="115" class="node"/>
      <text x="16" y="24" class="mono-copper">隔离写入</text>
      <text x="16" y="52" class="node-title">Git 工作树</text>
      <text x="16" y="75" class="mono">三方导入</text>
      <text x="16" y="94" class="mono">脏路径冲突保护</text>
    </g>
    <g transform="translate(1300 1100)">
      <rect width="530" height="115" class="node"/>
      <text x="18" y="24" class="mono">可重建 · 非权威</text>
      <text x="18" y="52" class="node-title">只读投影</text>
      <text x="18" y="75" class="mono">运行事件时间线 · 界面归约器 · 能力 / latest_run 报告</text>
      <text x="18" y="94" class="mono">contracts.json · OpenAPI · 架构内容快照</text>
    </g>
  </g>

  <g aria-label="页脚说明">
