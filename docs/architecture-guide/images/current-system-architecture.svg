    <g transform="translate(90 1100)">
      <rect width="410" height="115" class="node-authority"/>
      <text x="18" y="24" class="mono-copper">规范事实日志</text>
      <text x="18" y="52" class="node-title">SessionRepository · 模式 v9</text>
