function renderPage(){switch(S.page){case 'chat':return chatPage();case 'search':return searchPage();case 'feed':return feedPage();case 'ideas':return ideasPage();case 'goals':return goalsPage();case 'library':return libraryPage();case 'settings':return settingsPage()}}
function composer(){return `<div class="composer-wrap"><div class="composer"><input id="message-input" placeholder="给 Muse 发消息，告诉它你想完成什么..." onkeydown="if(event.key==='Enter'&&!event.shiftKey)sendMessage()" aria-label="发送消息"/><div class="tools"><div class="row" style="gap:1px"><button class="iconbtn" title="添加文件（演示）" onclick="toast('这是交互原型，文件上传未连接后端')">${I('plus')}</button><button class="iconbtn" title="语音输入（演示）" onclick="toast('语音输入为演示入口')">${I('mic')}</button></div><button class="sendbtn" title="发送" onclick="sendMessage()">${I('arrow')}</button></div></div><div class="chat-prompt">界面复刻演示 · 无真实模型或外部服务调用</div></div>`}
function chatPage(){let messages=S.chat.map(m=>`<div class="message ${m.role}">${m.role==='assistant'?AV():''}<div class="msg-content"><div class="bubble">${esc(m.text)}</div><div class="msgmeta">刚刚</div></div></div>`).join('');return `<section class="chat-area"><div class="chat-head">${AV(true)}<b>Muse</b><p>今天 · 10 月 20 日</p></div><div class="message user"><div class="msg-content"><div class="bubble">帮我规划一趟 6 天的东京旅行，顺便留意机票价格。如果有合适的航班可以提醒我。</div><div class="msgmeta">上午 09:41</div></div></div><div class="message assistant">${AV()}<div class="msg-content"><div class="bubble">当然可以！我已经为你整理了初步的旅行计划，并开始持续追踪航班价格。你不用一直开着应用，有值得关注的变化我会告诉你。 ✨</div><div class="msg-card"><div class="flight-hero"><div class="chip">FLIGHT PRICE TRACKER · LIVE</div><div class="cities">BEIJING <span>✈</span> TOKYO</div><div class="sub">东京 · 6 天城市探索之旅</div>${I('plane')}</div><div class="card-content"><div class="row space" style="margin-bottom:17px"><div><div class="strong" style="font-size:13px">机票价格追踪</div><div class="caption" style="margin-top:5px">计划已启用 · 持续检查航班</div></div><span class="pill green">${I('check')} 正在追踪</span></div><div class="flight-metrics"><div class="metric"><small>当前参考低价</small><b class="price">¥ 2,180</b></div><div class="metric"><small>目标预算</small><b>¥ 2,500</b></div><div class="metric"><small>最新状态</small><b>价格合适</b></div></div></div></div><div class="msgmeta">上午 09:42 · 已添加到 Goals</div></div></div><div class="message assistant">${AV()}<div class="msg-content"><div class="bubble">还有一件事：我找到了一家评价不错的餐厅，可以帮你预订一个靠窗的座位。提交预订前需要你的确认。</div><div class="approval"><div class="row"><div class="approval-icon">${I('shield')}</div><div><b style="font-size:13px">需要你的批准</b><div class="caption" style="margin-top:3px">预订操作 · 外部服务</div></div><span style="margin-left:auto" class="pill ${S.approval==='pending'?'orange':'green'}">${S.approval==='pending'?'等待操作':'已处理'}</span></div><p>为 2 人预订东京餐厅 Sushi Kaze 的晚餐座位。Muse 在发送信息前会先征求你的同意。</p><div class="row space" style="font-size:11px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:13px"><span class="muted">预订日期</span><b>11 月 14 日 · 19:30</b></div>${S.approval==='pending'?`<div class="act"><button class="softbtn" onclick="decision('deny')">拒绝</button><button class="primary" onclick="decision('allow')">${I('check')} 允许本次操作</button></div>`:`<div class="success">${I('check')} ${S.approval==='allow'?'已批准此演示操作（未实际预订）':'已拒绝此演示操作'}</div>`}</div><div class="msgmeta">上午 09:45</div></div></div>${messages}<div style="height:8px"></div></section>`}
function sendMessage(preset){let text=preset||document.getElementById('message-input')?.value.trim();if(!text)return;S.page='chat';S.chat.push({role:'user',text});S.chat.push({role:'assistant',text:'收到！我已把这个需求加入任务上下文。\n\n在正式产品中，我会调用相关工具执行并记录完整活动轨迹；当前为 UI 原型，因此这里演示对话和任务反馈，不执行真实操作。'});document.getElementById('root').innerHTML=layout();scrollChat();}
function scrollChat(){requestAnimationFrame(()=>{const v=document.querySelector('.view');if(v)v.scrollTop=v.scrollHeight;})}
function newChat(){S.chat=[];go('chat');toast('已开始新的演示对话')}
function decision(d){S.approval=d;store();render();toast(d==='allow'?'已模拟批准，未触发真实交易':'已模拟拒绝本次操作')}
function render(){document.getElementById('root').innerHTML=layout()}
function head(kicker,title,desc,right=''){return `<div class="page-head"><div><div class="page-kicker">${kicker}</div><h1 class="page-title">${title}</h1><p class="page-desc">${desc}</p></div>${right?`<div class="rhs">${right}</div>`:''}</div>`}
function feedPage(){return `<div class="view-inner">${head('PERSONALIZED FOR YOU','你的专属 Feed','Muse 会结合你的兴趣、近期对话与偏好，主动整理真正值得关注的内容。',`<button class="softbtn" onclick="regenFeed()">${I('refresh')} 重新生成</button>`)}<div class="feed-prompt"><div class="row space"><span class="section-label">YOUR FEED PROMPT</span><span class="pill blue">${I('spark')} 个性化生成</span></div>${S.feedEdit?`<textarea id="prompt-editor">${esc(S.feedPrompt)}</textarea><div class="row" style="margin-top:10px"><button class="primary" onclick="saveFeedPrompt()">保存并生成</button><button class="softbtn" onclick="S.feedEdit=false;render()">取消</button></div>`:`<p>${esc(S.feedPrompt)}</p><div class="row"><button class="softbtn" onclick="S.feedEdit=true;render()">${I('edit')} 编辑偏好</button><button class="softbtn" onclick="regenFeed()">${I('refresh')} 生成 Feed</button></div>`}</div><div class="row space" style="margin-bottom:17px"><h3 style="margin:0;font-size:17px">为你精选</h3><span class="caption">10 月 20 日 · ${S.feedVersion?'刚刚更新':'早上 08:20 更新'}</span></div><div class="news-layout">${news.map(n=>`<article class="card ${n.featured?'news-feature':''}"><div class="cover ${n.color}"><div class="cover-grid"></div><span class="cover-symbol">${n.icon}</span><span class="cover-caption">MUSE / ${esc(n.cat.toUpperCase())}</span></div><div class="news-body"><span class="section-label">${esc(n.cat)} · ${esc(n.time)}</span><h3>${esc(n.title)}</h3><p>${esc(n.desc)}</p><div class="news-actions"><button class="textbtn ${S.liked.includes(n.id)?'liked':''}" onclick="likeNews(${n.id})">${I('heart')} ${S.liked.includes(n.id)?'已收藏':'收藏'}</button><button class="textbtn" onclick="discussNews(${n.id})">${I('chat')} 与 Muse 讨论 ${I('chevron')}</button></div></div></article>`).join('')}</div><div class="feed-list"><h3>更多与你有关的内容</h3>${[['🧭','本周值得关注的旅行目的地与体验','旅行 · 昨天'],['💡','5 个让 AI Agent 更可靠的产品设计模式','产品思考 · 昨天'],['🎧','适合通勤收听的精选长文与播客','内容推荐 · 10 月 18 日']].map(v=>`<div class="compact-news" onclick="discussNews(1)"><div class="em">${v[0]}</div><div><h4>${v[1]}</h4><p>${v[2]}</p></div>${I('chevron')}</div>`).join('')}</div>${footerGuide()}</div>`}
function saveFeedPrompt(){let v=document.getElementById('prompt-editor')?.value.trim();if(!v)return toast('请输入 Feed 偏好');S.feedPrompt=v;S.feedEdit=false;store();regenFeed()}
function regenFeed(){S.feedVersion++;render();toast('已使用当前偏好重新生成演示 Feed')}
function likeNews(id){S.liked=S.liked.includes(id)?S.liked.filter(x=>x!==id):[...S.liked,id];render();toast(S.liked.includes(id)?'已收藏到你的内容偏好':'已取消收藏')}
function discussNews(id){let n=news.find(x=>x.id===id);sendMessage('和我聊聊这篇内容：'+n.title)}
function ideasPage(){let cats=['全部','出行与生活','工作效率','财务管理','健康与运动','学习与成长'];let rows=ideas.filter(x=>(S.ideaFilter==='全部'||x.cat===S.ideaFilter)&&!S[`hidden_${x.id}`]);return `<div class="view-inner">${head('CURATED IDEAS','你可能会喜欢这些主意','我会一直探索能为你做些什么。这些灵感源于你关心的事，也会随着反馈不断变化。',`<span class="pill blue">${I('spark')} 主动发现</span>`)}<div class="chipbar">${cats.map(c=>`<button class="filter ${S.ideaFilter===c?'active':''}" onclick="S.ideaFilter='${c}';render()">${c}</button>`).join('')}</div><div class="ideas-grid">${rows.map(x=>`<div class="card idea"><button class="iconbtn more" onclick="S.feedback=S.feedback===${x.id}?null:${x.id};render()" title="更多反馈">${I('more')}</button>${S.feedback===x.id?`<div class="feedback-menu"><button onclick="startIdea(${x.id})">开始执行</button><button onclick="ideaFeedback(${x.id},'more')">多推荐类似想法</button><button onclick="ideaFeedback(${x.id},'hide')">不感兴趣</button></div>`:''}<div class="emoji" style="background:${x.bg}">${x.icon}</div><div class="category">${x.cat}</div><h3>${x.title}</h3><p>${x.desc}</p><div class="footer"><button class="textbtn" onclick="startIdea(${x.id})" style="color:var(--blue);font-weight:700">开始试试 ${I('chevron')}</button><span class="caption">为你推荐</span></div></div>`).join('')}</div>${rows.length===0?`<div class="empty"><div class="illustration">💡</div><h4>当前没有更多建议</h4><p>切换分类看看别的灵感。</p></div>`:''}${footerGuide()}</div>`}
function startIdea(id){let x=ideas.find(x=>x.id===id);sendMessage('帮我开始这个计划：'+x.title)}
function ideaFeedback(id,kind){S.feedback=null;if(kind==='hide'){S[`hidden_${id}`]=true;toast('已减少此类推荐')}else toast('Muse 会优先推荐相似方向的想法');render()}
function goalsPage(){return `<div class="view-inner">${head('LONG-TERM GOALS','重要的事，持续向前','Muse 不止记住你的目标，还会自动拆解步骤、追踪变化并在需要时提醒你。',`<button class="primary" onclick="showModal('goal')">${I('plus')} 创建目标</button>`)}<div class="goals-summary"><div class="summary-tile"><b>${S.goals.length.toString().padStart(2,'0')}</b><span>正在追踪的目标</span></div><div class="summary-tile"><b>${S.goals.reduce((n,g)=>n+g.done.length,0).toString().padStart(2,'0')}</b><span>已完成的里程碑</span></div><div class="summary-tile"><b>24/7</b><span>后台持续运行（演示）</span></div></div>${S.goals[0]?`<div class="card featured-goal"><div class="left"><span class="pill green">${I('activity')} ${esc(S.goals[0].status)}</span><h3>${esc(S.goals[0].title)}</h3><p>${esc(S.goals[0].desc)}</p><div style="margin-top:28px"><div class="row space"><span class="small strong">目标进度</span><span class="small strong" style="color:var(--blue)">${S.goals[0].pct}%</span></div><div class="progress"><span style="width:${S.goals[0].pct}%"></span></div></div><button class="softbtn" onclick="showGoal(${S.goals[0].id})" style="margin-top:18px">查看目标进展 ${I('chevron')}</button></div><div class="goal-art"><span>${S.goals[0].icon}</span><div class="floating f1">✓ 规划路线已完成</div><div class="floating f2">◉ 正在追踪航班价格</div></div></div>`:''}<div class="row space" style="margin-bottom:18px"><h3 style="font-size:17px;margin:0">全部目标</h3><span class="caption">每个目标都有独立的行动计划</span></div><div class="goal-grid">${S.goals.map(g=>`<article class="card goal-card" onclick="showGoal(${g.id})"><div class="row space"><span style="font-size:28px">${g.icon}</span><span class="pill green">${esc(g.status)}</span></div><h4>${esc(g.title)}</h4><p>${esc(g.desc)}</p><div class="progress"><span style="width:${g.pct}%"></span></div><div class="goal-footer"><span class="caption">${g.done.length} / ${g.items.length} 个里程碑</span><span class="progress-small">${g.pct}% ${I('chevron')}</span></div></article>`).join('')}</div>${footerGuide()}</div>`}
function showGoal(id){let g=S.goals.find(x=>x.id===id);if(!g)return;S.modal='goal-'+id;document.getElementById('overlay-root').innerHTML=`<div class="overlay modal-overlay" onclick="closeOverlay()"><div class="modal goal-detail" onclick="event.stopPropagation()"><div class="row space"><span class="pill blue">GOAL DETAIL</span><button class="iconbtn" onclick="closeOverlay()">${I('close')}</button></div><div class="row" style="margin-top:20px"><span style="font-size:39px">${g.icon}</span><div><h3>${esc(g.title)}</h3><p style="margin:4px 0 0">${esc(g.desc)}</p></div></div><div class="row space" style="margin-top:27px"><b class="small">里程碑进度</b><b class="small" style="color:var(--blue)">${g.pct}%</b></div><div class="progress"><span style="width:${g.pct}%"></span></div><div class="divider"></div><div class="section-label" style="margin-bottom:12px">ACTION PLAN</div>${g.items.map((item,i)=>`<label class="checkline"><input type="checkbox" ${g.done.includes(i)?'checked':''} onchange="toggleGoalItem(${id},${i})"/><span style="${g.done.includes(i)?'color:var(--muted);text-decoration:line-through':''}">${esc(item)}</span></label>`).join('')}<div class="modal-foot"><button class="softbtn" onclick="closeOverlay()">关闭</button><button class="primary" onclick="closeOverlay();sendMessage('继续推进目标：${esc(g.title)}')">让 Muse 继续推进 ${I('chevron')}</button></div></div></div>`}
function toggleGoalItem(id,i){let g=S.goals.find(x=>x.id===id);g.done=g.done.includes(i)?g.done.filter(v=>v!==i):[...g.done,i];g.pct=Math.round(100*g.done.length/g.items.length);showGoal(id);render();toast('目标进度已更新（演示）')}
function libraryPage(){let cats=['全部','文档','报告','表格','指南','交互应用'];let rows=assets.filter(a=>S.libraryFilter==='全部'||a.type===S.libraryFilter);return `<div class="view-inner">${head('YOUR LIBRARY','所有创作，都在这里','你与 Muse 创建的文档、分析、计划与交互式工具，都可以在这里继续打开和使用。',`<span class="pill blue">${assets.length} 个演示产物</span>`)}<div class="chipbar">${cats.map(c=>`<button class="filter ${S.libraryFilter===c?'active':''}" onclick="S.libraryFilter='${c}';render()">${c}</button>`).join('')}</div><div class="library-grid">${rows.map(a=>`<article class="card asset" onclick="showAsset(${a.id})"><div class="asset-preview ${a.kind}">${a.kind==='sheet'?'<div class="sheet-art"><i></i><i></i><i></i><i></i><i></i><i></i></div>':a.kind==='chess'?`<div class="chessboard">${'♜♞♝♛♚♝♞♜♟♟♟♟♙♙♙♙'.split('').map(s=>`<span>${s}</span>`).join('')}</div>`:`<span class="mockicon">${a.emoji}</span>`}</div><div class="asset-body"><span class="section-label">${a.type}</span><h4>${a.title}</h4><p>${a.date}</p></div></article>`).join('')}</div>${footerGuide()}</div>`}
function showAsset(id){let a=assets.find(x=>x.id===id);document.getElementById('overlay-root').innerHTML=`<div class="overlay modal-overlay" onclick="closeOverlay()"><div class="modal" onclick="event.stopPropagation()"><div class="row space"><span class="pill blue">${a.type}</span><button class="iconbtn" onclick="closeOverlay()">${I('close')}</button></div><div style="height:155px;display:grid;place-items:center;background:var(--surface2);border-radius:15px;font-size:72px;margin:20px 0">${a.emoji}</div><h3>${a.title}</h3><p>${a.desc}。这是 Muse 自动生成内容的交互式原型展示，未连接真实文件存储。</p><div class="row space" style="margin:18px 0"><span class="caption">最近编辑</span><span class="small">${a.date}</span></div><div class="modal-foot"><button class="softbtn" onclick="closeOverlay()">关闭</button><button class="primary" onclick="closeOverlay();sendMessage('继续完善我的'+ '${a.title}' + '');">继续编辑 ${I('chevron')}</button></div></div></div>`}
function searchPage(){const all=[...S.goals.map(g=>({id:'goal-'+g.id,title:g.title,sub:g.desc,icon:g.icon,page:'goals',cat:'目标'})),...assets.map(a=>({id:'asset-'+a.id,title:a.title,sub:a.desc,icon:a.emoji,page:'library',cat:a.type})),...news.map(n=>({id:'news-'+n.id,title:n.title,sub:n.desc,icon:'📰',page:'feed',cat:'信息流'})),...ideas.map(i=>({id:'idea-'+i.id,title:i.title,sub:i.desc,icon:i.icon,page:'ideas',cat:'灵感'}))];let rs=all.filter(x=>`${x.title} ${x.sub} ${x.cat}`.toLowerCase().includes(S.search.toLowerCase()));return `<div class="view-inner" style="max-width:940px">${head('GLOBAL SEARCH','寻找你的任何内容','搜索已经聊过的内容、正在追踪的目标和 Muse 帮你制作的资源。')}<div class="searchbox">${I('search')}<input id="global-search" placeholder="搜索对话、目标、文件和灵感..." value="${esc(S.search)}" oninput="searchChange(this.value)" autocomplete="off"/><span class="caption">${rs.length} 条结果</span></div><div id="search-results">${searchResults(rs)}</div>${footerGuide()}</div>`}
function searchResults(rs){return rs.length?rs.map(x=>`<div class="search-result" onclick="go('${x.page}')"><div class="resulticon">${x.icon}</div><div><h4>${esc(x.title)}</h4><p>${esc(x.cat)} · ${esc(x.sub.slice(0,63))}</p></div><div class="right">${I('chevron')}</div></div>`).join(''):`<div class="empty"><div class="illustration">🔎</div><h4>没有找到相关内容</h4><p>试试搜索其他关键词，例如“旅行”“Agent”“周报”。</p></div>`}
function searchChange(v){S.search=v;let q=v.toLowerCase();let arr=[...S.goals.map(g=>({title:g.title,sub:g.desc,icon:g.icon,page:'goals',cat:'目标'})),...assets.map(a=>({title:a.title,sub:a.desc,icon:a.emoji,page:'library',cat:a.type})),...news.map(n=>({title:n.title,sub:n.desc,icon:'📰',page:'feed',cat:'信息流'})),...ideas.map(i=>({title:i.title,sub:i.desc,icon:i.icon,page:'ideas',cat:'灵感'}))].filter(x=>`${x.title} ${x.sub} ${x.cat}`.toLowerCase().includes(q));document.getElementById('search-results').innerHTML=searchResults(arr)}
const settingsTabs=[['general','settings','通用'],['connectors','link','连接的应用'],['permissions','shield','权限与安全'],['memory','document','个人记忆'],['appearance','moon','外观'],['data','lock','数据控制']];
function settingsPage(){return `<div class="view-inner">${head('PREFERENCES','设置你的 Muse','你始终可以查看 Muse 知道什么、连接了哪些应用，以及允许它完成哪些操作。')}<div class="settings-layout"><aside class="settings-aside">${settingsTabs.map(x=>`<button class="${S.settingsTab===x[0]?'active':''}" onclick="S.settingsTab='${x[0]}';render()">${I(x[1])}${x[2]}</button>`).join('')}</aside><section class="settings-main">${settingsContent()}</section></div>${footerGuide()}</div>`}
function settingsContent(){switch(S.settingsTab){case'general':return `<h3>通用设置</h3><p class="hint">让 Muse 更符合你的使用方式。</p><div class="setting-row"><div><b>你的 Muse 名字</b><p>当前名字：Muse</p></div><button class="softbtn" onclick="toast('名称更改为原型预留交互')">更改</button></div><div class="setting-row"><div><b>通知</b><p>当任务完成、重要信息变化或需要批准时通知你。</p></div><button class="toggle on" onclick="this.classList.toggle('on');toast('已调整演示通知偏好')"></button></div><div class="setting-row"><div><b>后台任务</b><p>允许 Muse 在关闭界面后继续执行你授权的长期目标。</p></div><button class="toggle on" onclick="this.classList.toggle('on');toast('后台执行为演示状态')"></button></div><div class="setting-row"><div><b>使用计划</b><p>个人免费版 · 演示数据</p></div><span class="pill blue">Demo plan</span></div>`;case'connectors':return `<h3>连接的应用</h3><p class="hint">连接你常用的工具。每项权限都可以随时撤销，本原型不会进行实际授权。</p>${[['Gmail','✉️','邮件读取与草稿处理'],['Google 日历','📅','查看与管理日程'],['Google Drive','🔺','查找和管理文档'],['Notion','🗒️','知识库与项目管理'],['Slack','💬','团队消息与协作'],['GitHub','🧑‍💻','代码仓库与任务']].map(([name,emoji,desc])=>`<div class="connect-row"><div class="appicon">${emoji}</div><div><b>${name}</b><p>${desc}</p></div><button class="softbtn" onclick="toggleConnection('${name}')">${S.connections[name]?'已连接 · 断开':'连接'}</button></div>`).join('')}`;case'permissions':return `<h3>权限与审批</h3><p class="hint">Muse 可以自动完成低风险步骤，在发送、付款或共享信息之前征求明确同意。</p><div class="setting-row"><div><b>在发送邮件前询问</b><p>所有发送操作都需要你先批准。</p></div><button class="toggle on" onclick="this.classList.toggle('on');toast('已更新演示授权规则')"></button></div><div class="setting-row"><div><b>购买或预订前询问</b><p>在提交订单或预约前暂停并展示详情。</p></div><button class="toggle on" onclick="this.classList.toggle('on');toast('已更新演示授权规则')"></button></div><div class="setting-row"><div><b>访问敏感数据前询问</b><p>密码、支付及私密内容采用更严格控制。</p></div><button class="toggle on" onclick="this.classList.toggle('on');toast('已更新演示授权规则')"></button></div><div style="margin-top:20px"><button class="softbtn" onclick="showActivity()">${I('activity')} 查看所有操作记录</button></div>`;case'memory':return `<h3>你的记忆</h3><p class="hint">查看或删除 Muse 用于个性化建议的记忆。以下为本地模拟数据。</p>${S.memories.map((m,i)=>`<div class="memory-card"><div class="memory-copy"><b>${esc(m.type)}</b>${esc(m.text)}</div><div class="memory-action"><button class="iconbtn" title="编辑" onclick="showModal('memory-${i}')">${I('edit')}</button><button class="iconbtn" title="删除" onclick="deleteMemory(${i})">${I('trash')}</button></div></div>`).join('')}<button class="softbtn" onclick="showModal('memory-new')" style="margin-top:10px">${I('plus')} 新增记忆</button>`;case'appearance':return `<h3>外观</h3><p class="hint">切换浅色和深色模式，浏览不同视觉形态的 Muse UI。</p><div class="setting-row"><div><b>深色模式</b><p>让界面更适合夜间浏览。</p></div><button class="toggle ${document.body.classList.contains('dark')?'on':''}" onclick="toggleTheme()"></button></div><div class="setting-row"><div><b>强调色</b><p>Muse 蓝 · #0B72F3</p></div><span style="width:24px;height:24px;background:#0b72f3;border-radius:50%;box-shadow:0 0 0 3px var(--surface),0 0 0 4px var(--line2)"></span></div>`;case'data':return `<h3>数据控制</h3><p class="hint">访问你的个人内容与权限配置。在正式产品中，这里应提供数据导出及清除功能。</p><div class="setting-row"><div><b>数据导出</b><p>导出本原型保存的偏好及设置。</p></div><button class="softbtn" onclick="exportDemo()">导出</button></div><div class="setting-row"><div><b>重置原型数据</b><p>清除本地保存的模拟审批、连接及个性化设置。</p></div><button class="softbtn" onclick="showModal('reset')">重置</button></div>`}}
function toggleConnection(n){S.connections[n]=!S.connections[n];store();render();toast(`${n}：${S.connections[n]?'已模拟连接':'已断开演示连接'}`)}
function toggleTheme(){document.body.classList.toggle('dark');localStorage.setItem('muse-demo-dark',document.body.classList.contains('dark')?'1':'0');render()}
function deleteMemory(i){S.memories.splice(i,1);store();render();toast('已删除这条演示记忆')}
function exportDemo(){const blob=new Blob([JSON.stringify({feedPrompt:S.feedPrompt,connections:S.connections,memories:S.memories,goals:S.goals},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='muse-demo-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function footerGuide(){return `<div class="guide">Muse 产品界面研究复刻 · 独立教学原型 · 非 Meta 官方产品 · <a target="_blank" rel="noopener" href="https://introducing-muse.com/">设计参考 ↗</a></div>`}
function showActivity(){document.getElementById('overlay-root').innerHTML=`<div class="overlay" onclick="closeOverlay()"><aside class="drawer" onclick="event.stopPropagation()"><div class="drawer-head"><div class="row space"><div class="row">${AV(true)}<div><b style="font-size:17px">Muse 正在工作</b><div class="caption" style="margin-top:5px">活动记录与执行状态</div></div></div><button class="iconbtn" onclick="closeOverlay()">${I('close')}</button></div></div><div class="drawer-scroll"><div class="card" style="padding:18px;margin-bottom:27px;background:var(--surface2)"><div class="row space"><b style="font-size:13px">当前运行状态</b><span class="pill green"><span class="dot"></span> 正在运行</span></div><p style="font-size:12px;line-height:1.9;color:var(--sub);margin-bottom:0">正在持续追踪你的旅行计划，并会在需要授权或出现重要变化时通知你。</p><div class="row space" style="margin-top:14px"><span class="caption">可查看的活动</span><b class="small">${S.activity.length} 条</b></div></div><div class="section-label" style="margin-bottom:25px">RECENT ACTIVITY</div><div class="timeline">${S.activity.map(x=>`<div class="event ${x.status}"><small>${x.time}</small><b>${x.title}</b><p>${x.desc}</p></div>`).join('')}</div><div class="divider"></div><button class="softbtn" onclick="closeOverlay();go('settings');S.settingsTab='permissions';render()" style="width:100%;justify-content:center">${I('shield')} 查看权限设置</button><p class="caption" style="line-height:1.85;margin-top:14px">实际 Muse 提供可检查的活动轨迹；此处为静态数据驱动的可交互演示。</p></div></aside></div>`}
function closeOverlay(){document.getElementById('overlay-root').innerHTML='';S.modal=null}
function showModal(type){S.modal=type;let content='';if(type==='goal'){content=`<h3>创建长期目标</h3><p>告诉 Muse 你希望持续推进的事情，模拟创建目标和进度计划。</p><label class="fieldlabel">目标名称</label><input id="goal-name" class="field" placeholder="例如：每周自动整理我的学习笔记" maxlength="45"/><label class="fieldlabel">补充说明</label><textarea id="goal-desc" class="field" placeholder="成功标准、频率和期望的结果"></textarea><div class="modal-foot"><button class="softbtn" onclick="closeOverlay()">取消</button><button class="primary" onclick="createGoal()">创建目标</button></div>`}else if(type==='notifications'){content=`<div class="row space"><h3>通知中心</h3><span class="pill blue">2 条更新</span></div><p>以下是演示通知，未发送真实提醒。</p><div class="connect-row"><div class="appicon">✈️</div><div><b>航班追踪已更新</b><p>你关注的北京 → 东京航班有新的价格信息</p></div></div><div class="connect-row"><div class="appicon">🔐</div><div><b>有一项操作等待授权</b><p>餐厅预订需要你先确认</p></div></div><div class="modal-foot"><button class="primary" onclick="closeOverlay();go('chat')">返回对话</button></div>`}else if(type==='reset'){content=`<h3>重置原型数据？</h3><p>将清除浏览器中保留的界面演示设置并刷新页面，不会影响任何真实 Muse 数据。</p><div class="modal-foot"><button class="softbtn" onclick="closeOverlay()">取消</button><button class="primary" onclick="localStorage.clear();location.reload()">确认重置</button></div>`}else if(type.startsWith('memory-')){let id=type.split('-')[1];let m=id==='new'?null:S.memories[Number(id)];content=`<h3>${m?'编辑记忆':'新增记忆'}</h3><p>这是用于演示 UI 的本地记忆，不会发送到任何 AI 服务。</p><label class="fieldlabel">记忆类别</label><input id="mem-type" class="field" value="${esc(m?.type||'偏好')}"/><label class="fieldlabel">记忆内容</label><textarea id="mem-text" class="field">${esc(m?.text||'')}</textarea><div class="modal-foot"><button class="softbtn" onclick="closeOverlay()">取消</button><button class="primary" onclick="saveMemory('${id}')">保存记忆</button></div>`}document.getElementById('overlay-root').innerHTML=`<div class="overlay modal-overlay" onclick="closeOverlay()"><div class="modal" onclick="event.stopPropagation()"><div class="row space" style="margin-bottom:14px"><span class="section-label">MUSE UI PROTOTYPE</span><button class="iconbtn" onclick="closeOverlay()">${I('close')}</button></div>${content}</div></div>`}
function createGoal(){const title=document.getElementById('goal-name')?.value.trim(),desc=document.getElementById('goal-desc')?.value.trim();if(!title)return toast('请填写目标名称');S.goals.push({id:Date.now(),title,desc:desc||'一个由你定义的新长期目标',pct:0,icon:'🎯',category:'个人目标',status:'刚刚创建',items:['确认目标与行动方向','制定阶段计划','开始持续追踪'],done:[]});closeOverlay();render();toast('已创建演示目标')}
function saveMemory(id){let type=document.getElementById('mem-type')?.value.trim(),value=document.getElementById('mem-text')?.value.trim();if(!value)return toast('请输入记忆内容');if(id==='new')S.memories.push({type:type||'偏好',text:value});else S.memories[Number(id)]={type:type||'偏好',text:value};store();closeOverlay();render();toast('已保存演示记忆')}
if(localStorage.getItem('muse-demo-dark')==='1')document.body.classList.add('dark');
render();
</script>
</body></html>
