[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lumen-agent"
version = "0.1.0"
description = "Lumen: a configurable agent framework with local tools, MCP, and a Textual TUI"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.11",
  "pydantic-ai-slim[anthropic,google,mcp,openai]>=2.1.0",
  "pyyaml>=6.0.2",
  "textual>=6.1",
  "typer>=0.16",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
# Exact OpenAI token metering for the context engine; without it budgeting
# falls back to the conservative estimator (never a hard failure).
tokenizers = [
  "tiktoken>=0.7,<1",
]
# Trafilatura article extraction: the web_fetch fast path. Without it
# web_fetch silently falls back to the stdlib plain-text extractor.
web = [
  "trafilatura>=2.1",
]
# Phase 2 browser tier (Crawl4AI) for JS-rendered pages. Declared now so the
# browser phase does not touch packaging; nothing imports crawl4ai yet.
# Pinned >=0.9.3 for the PDF-path SSRF fix; browser binaries need a separate
# crawl4ai-setup download.
browser = [
  "crawl4ai>=0.9.3",
]
live = [
  "websockets>=14,<17",
]

[project.scripts]
lumen = "lumen.cli:app"

[dependency-groups]
dev = [
  "mcp[cli]>=1.12",
  "pyright>=1.1.400",
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "pytest-cov>=6.2",
  "pytest-textual-snapshot>=1.1",
  "pytest-timeout>=2.4",
  "ruff>=0.12",
  "tiktoken>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lumen"]
artifacts = ["src/lumen/builtin_skills/**"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
# The legacy ContextManager is deprecated behind ContextEngine (M1). The
# characterization tests in test_context*.py intentionally exercise it directly,
# so its deprecation warning is expected noise there; production code uses
# ContextEngine. Scoped to this exact message so any other deprecation stays
# visible.
filterwarnings = [
  "ignore:lumen.context.ContextManager is deprecated:DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["pi", "posting"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.pyright]
include = ["src", "tests"]
exclude = [".venv", "pi", "posting", "**/node_modules"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.coverage.run]
branch = true
source = ["lumen"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
