version: 2

agent:
  name: lumen
  prompt:
    mode: append
    preset: lumen
    append_file: prompts/system.md
  # Multi-model form: pick the active model with `default_model` (or via the
  # CLI flag `--model <name>` / TUI command `/model <name>`). Each entry is a
  # ModelSettingsConfig: id uses the `<provider>:<model>` convention, and the
  # api_key is loaded from the named env var.
  default_model: deepseek-flash
  models:
    deepseek-flash:
      id: openai:deepseek-flash
      api_key_env: DEEPSEEK_API_KEY
      base_url: https://api.deepseek.com
      api: responses            # 默认路径；DeepSeek Responses 是无状态的部分兼容实现
      native_web_search:
        mode: auto              # 精确 Provider Catalog 路由默认开启；Kimi/Qwen 也可按各自协议匹配
        search_context_size: medium
      context:
        # Exact ID from src/lumen/context/profiles.py. The profile supplies
        # window_tokens=1000000 and max_output_tokens=384000.
        profile: deepseek-flash
        # Deployment-specific capability overrides are also read here:
        # window_tokens: 1000000
        # max_output_tokens: 384000
      settings:
        # Requested output for each provider call. Lumen reserves it in full;
        # it must not exceed context.max_output_tokens or the total window.
        max_tokens: 65536
    glm-5.2:
      id: openai:glm-5.2
      api_key_env: DASHSCOPE_API_KEY
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api: responses
      context:
        profile: glm-5.2        # 部署端输出上限可用 max_output_tokens 显式覆盖
    kimi-k3:
      # 可选 reasoning_effort: low/high/max；medium→high，xhigh→max，不提供 off。
      id: openai:k3
      api_key_env: KIMI_API_KEY
      base_url: https://api.kimi.com/coding/v1
      api: responses
      input_modalities: [text, image]
      context:
        profile: kimi-k3
        max_output_tokens: 65536 # 按实际部署能力显式配置
    gpt-5.6:
      id: openai:gpt-5.6
      api_key_env: OPENAI_API_KEY
      api: responses
      reasoning_effort: medium  # 类型化选择；CLI --thinking / TUI、Web /thinking 可按 Session 覆盖
      # Custom proxies can explicitly declare a reviewed contract (exact ID/API must match):
      # reasoning_profile: openai-gpt56-sol
      # Full supported matrix: docs/generated/provider-reasoning.md
      context:
        profile: openai-gpt-5.6
    qwen3.8-max:
      # 可选 reasoning_effort: off/low/medium/xhigh；high、max 均映射 xhigh。
      id: openai:qwen3.8-max
      api: responses
      api_key_env: DASHSCOPE_API_KEY
      base_url: https://YOUR_WORKSPACE.cn-beijing.maas.aliyuncs.com/api/v2/apps/protocols/compatible-mode/v1
      context:
        profile: alibaba-qwen3.8
      settings:
        max_tokens: 65536       # 架构上限 131072；按延迟/成本需要调整
        # 原始 thinking 参数保持兼容；建议使用模型级 reasoning_effort，不能同时设置两者。
    omlx-qwen3.8-27b-4bit:
      # oMLX uses the model ID returned by GET /v1/models, not the Hugging Face repo path.
      id: openai:Qwen3.8-27B-4bit
      api_key_env: OMLX_API_KEY
      base_url: http://127.0.0.1:8091/v1
      api: responses
      input_modalities: [text, image]
      context:
        window_tokens: 262144
        max_output_tokens: 32768
        tokenizer:
          kind: conservative
      settings:
        max_tokens: 32768
  # Legacy single-model form is still accepted. Use either `model:` or
  # `models:`, never both.
  # model:
  #   id: openai:gpt-5.6
  #   api_key_env: OPENAI_API_KEY
  #   base_url: null
  #   settings:
  #     max_tokens: 16384
  limits:
    request_count: null        # optional explicit per-run budget
    tool_calls: null
    output_limit_retries: 3    # only an implicit max_tokens may grow automatically
    # No total_tokens cap — ContextEngine uses the active model profile and
    # ratio policy for automatic compaction. See README "运行限制" section.
    tool_timeout_seconds: 60
    model_stream_idle_timeout_seconds: 300  # resets on incoming stream data
    model_request_timeout_seconds: null     # optional absolute deadline
    model_retries: 5
    model_retry_delay_seconds: 2
    model_retry_max_delay_seconds: 60
    skill_script_timeout_seconds: 30
    # sequential | parallel_safe | parallel; native Loop overlaps only calls
    # explicitly declared PARALLEL_SAFE, independently of approval risk. Default: parallel_safe.
    parallel_tool_calls: parallel_safe
  # Builtins are packaged but opt-in so existing catalogs stay unchanged.
  builtin_skills_enabled: true
  # Only the managed installer may write ~/.lumen/skills; shell sandbox stays enabled.
  user_skill_install_enabled: true

tools:
  builtins:
    - read_file
    - list_directory
    - search_text
    - web_fetch
    - download_file
    - install_skill
    - write_file
    - edit_file
    - run_command
  web:
    # Per-attempt timeout. Static fetch/download retries transient 408/425/429/5xx failures 3 times.
    fetch_timeout_seconds: 20
    fetch_max_bytes: 2097152
    # auto: HTML pages the HTTP fast path cannot read (JS shells) may be rendered by the
    # optional browser tier (requires `pip install lumen-agent[browser]` + `crawl4ai-setup`;
    # silently skipped when not installed). http_only disables the browser tier.
    fetch_strategy: auto
    # web_search is only registered when a provider + API key env are set.
    # search:
    #   provider: tavily          # tavily | brave | searxng
    #   api_key_env: TAVILY_API_KEY
    #   max_results: 8
    # Self-hosted SearXNG needs no API key; its base_url is operator-trusted
    # and skips the public-host SSRF check, so bind the instance to localhost.
    # search:
    #   provider: searxng
    #   base_url: http://127.0.0.1:8080
    #   # api_key_env: SEARXNG_TOKEN        # optional, for reverse-proxy auth
    #   max_results: 8
    #   engines: [duckduckgo, brave, bing, baidu]  # pin known-good engines
    #   language: all

# Native session-scoped depth-one Agent Threads. Explicit user/project/Skill
# instructions require delegation; otherwise the root Agent delegates only
# when parallel work materially improves speed, isolation, or verification.
agents:
  enabled: true
  autonomy: adaptive
  max_depth: 1
  worktree_root: ~/.lumen/worktrees
  max_concurrency: 3
  max_agents_per_run: 8
  default_agent: default
  recovery: safe
  request_count: null
  tool_calls: null
  timeout_seconds: null

collaboration:
  default_mode: default

ui:
  theme: lumen-dark
  transcript_density: normal   # normal | verbose; Ctrl+O toggles live
  animations: true             # false freezes the activity glyph (reduced motion)
  terminal_title: true
  notifications: true
  vim_mode: false
  status_line: [mode, state, model, usage, keymap]

sandbox:
  mode: workspace_write
  network: false
  extra_read_paths: []
  extra_write_paths: []
  env_allow: [PATH, LANG, LC_ALL, TERM, TMPDIR]

# Durable, session-scoped work products. Existing write_file/edit_file calls
# keep their interface and are automatically journaled through this module.
work_products:
  enabled: true
  auto_attach: true
  strict: true
  max_context_items: 8

# Browser realtime voice. The Router selects a Provider Profile once per call.
# Bailian uses a Host-controlled PCM WebSocket so Provider events, tools and
# credentials never pass through the browser. Requires `lumen-agent[live]`.
live:
  enabled: false
  default_route: cn-primary
  fallback_routes: [cn-fast]
  routes:
    cn-primary:
      provider: bailian
      model: qwen3.5-omni-plus-realtime
      region: cn-beijing
      api_key_env: DASHSCOPE_API_KEY
      workspace_id_env: DASHSCOPE_WORKSPACE_ID
      voice: Tina
      completion_control: host_gated_synthesis
    cn-fast:
      provider: bailian
      model: qwen3.5-omni-flash-realtime
      region: cn-beijing
      api_key_env: DASHSCOPE_API_KEY
      workspace_id_env: DASHSCOPE_WORKSPACE_ID
      voice: Tina
      completion_control: host_gated_synthesis
  reasoning_effort: low
  turn_detection:
    type: semantic_vad
    eagerness: auto
    interrupt_response: true
  input_transcription:
    enabled: true
    model: qwen3-asr-flash-realtime
    language: zh
  strict_completion: true
  max_sessions: 1
  rollover_seconds: 3300
  persist_audio: false
  max_context_items: 24

mcp_servers:
  # Two optional Streamable HTTP examples. Set `required: false` so a
  # transient remote outage becomes a warning instead of a startup failure.
  tyc-mcp:
    transport: streamable_http
    url: https://mcp.tianyancha.com/v1
    headers:
      Authorization: ${TYC_TOKEN}
    defer_tools: true             # default: schema is resolved by tool search
    always_load_tools: []         # raw tool names that must always stay visible
    # Generic dispatch can invoke capabilities beyond a simple lookup, so it
    # stays approval-gated even in auto mode. The remaining tools are reads.
    tool_risks:
      call_tool: execute
      call_tools_batch: execute
      get_company_basic_profile: read
      get_company_capabilities: read
      get_company_group_profile: read
      get_company_people: read
      get_group_info: read
      get_person_profile: read
      get_person_risk_profile: read
      search_bids: read
      search_companies: read
      search_companies_by_industry_region: read
      search_companies_by_ranking: read
      search_companies_by_tag: read
      search_listed_companies: read
      search_patents: read
      search_trademarks: read
    tool_effects:
      call_tool: unknown
      call_tools_batch: unknown
      get_company_basic_profile: observe
      search_companies: observe
    required: false
  exa:
    transport: streamable_http
    url: https://mcp.exa.ai/mcp
    headers:
      x-api-key: ${EXA_API_KEY}
    defer_tools: true
    tool_risks:
      web_fetch_exa: read
      web_search_exa: read
    tool_effects:
      web_fetch_exa: observe
      web_search_exa: observe
    required: false
    load_resources: true
    load_prompts: true

  # OAuth uses MCP protected-resource discovery + PKCE, persists refreshable
  # credentials as a 0600 JSON file under sessions.directory.
  # github:
  #   transport: streamable_http
  #   url: https://example.com/mcp
  #   oauth:
  #     client_id: ${GITHUB_MCP_CLIENT_ID}
  #     scopes: [repo, read:user]
  #     credential_file: mcp_oauth/github.json
  #   tool_risks:
  #     search_code: read
  #   tool_effects:
  #     search_code: observe
  #   required: false

# 独立的连接策略；Web 设置中的 MCP 开关只写这里，不复制 URL 或凭据。
mcp:
  enabled:
    exa: true

# Hooks run without a shell. Context is JSON on stdin; exit 0 allows, exit 2
# denies, and JSON stdout can modify args/result/prompt. See docs/hooks/README.md.
# hooks:
#   - event: pre_tool_use
#     matcher: run_command
#     command: [bash, .lumen/hooks/block-dangerous.sh]
#   - event: post_tool_use
#     matcher: write_file
#     module: my_hooks.autoformat
#     factory: hook

permissions:
  # Side-effect approval is orthogonal to collaboration mode.
  # manual | accept_edits | auto
  default_mode: manual
  always_allow: []
  always_deny: []

sessions:
  directory: .lumen/sessions

context:
  enabled: true
  soft_ratio: 0.80
  hard_ratio: 0.92
  target_ratio: 0.55
  # soft_token_limit / keep_recent_tokens 仍兼容，但会产生弃用提示；
  # recent 上限可在 agent.models.<name>.context.keep_recent_tokens 覆盖。
  summary_max_tokens: 2000
  background_compaction: true
  background_trigger_ratio: 0.90

# Explicit recall is enabled; automatic extraction is opt-in and makes no
# background model calls while learn=false.
memory:
  use: true
  learn: false
  external_context: exclude
  min_session_turns: 4
  idle_seconds: 120
  max_attempts: 5
  retry_base_seconds: 2
