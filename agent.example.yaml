version: 1

agent:
  name: lumen
  instructions_file: prompts/system.md
  # Multi-model form: pick the active model with `default_model` (or via the
  # CLI flag `--model <name>` / TUI command `/model <name>`). Each entry is a
  # ModelSettingsConfig: id uses the `<provider>:<model>` convention, and the
  # api_key is loaded from the named env var.
  default_model: deepseek-v4-flash
  models:
    deepseek-v4-flash:
      id: openai:deepseek-v4-flash
      api_key_env: DEEPSEEK_API_KEY
      base_url: https://api.deepseek.com/v1
      api: chat                 # OpenAI-compatible /chat/completions path
      context:
        # Exact ID from src/lumen/context/profiles.py. The profile supplies
        # window_tokens=1000000 and max_output_tokens=384000.
        profile: deepseek-v4-flash
        # Deployment-specific capability overrides are also read here:
        # window_tokens: 1000000
        # max_output_tokens: 384000
      settings:
        # Requested output for each provider call. Lumen reserves it in full;
        # it must not exceed context.max_output_tokens or the total window.
        max_tokens: 65536
    glm-5.2:
      id: openai:glm-5.2
      api_key_env: DASHSCOPE_API_KEY
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api: chat                 # 阿里云百炼 Chat Completions(最稳)
      context:
        profile: glm-5.2        # 部署端输出上限可用 max_output_tokens 显式覆盖
    kimi-k3:
      id: openai:kimi-k3
      api_key_env: KIMI_API_KEY
      base_url: https://api.moonshot.cn/v1
      api: chat
      context:
        profile: kimi-k3
        max_output_tokens: 65536 # 按实际部署能力显式配置
    gpt-5.6:
      id: openai:gpt-5.6
      api_key_env: OPENAI_API_KEY
      api: responses
      context:
        profile: openai-gpt-5.6
    qwen3-max:
      id: openai:qwen3-max
      api_key_env: DASHSCOPE_API_KEY
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api: responses            # 阿里云百炼 Responses API(可选;不开 previous_response_id/内置工具)
  # Legacy single-model form is still accepted. Use either `model:` or
  # `models:`, never both.
  # model:
  #   id: openai:gpt-5.6
  #   api_key_env: OPENAI_API_KEY
  #   base_url: null
  #   settings:
  #     max_tokens: 4096
  limits:
    request_count: 50          # raise if multi-step tasks halt at the limit
    tool_calls: 100
    # No total_tokens cap — ContextEngine uses the active model profile and
    # ratio policy for automatic compaction. See README "运行限制" section.
    tool_timeout_seconds: 60
    skill_script_timeout_seconds: 30
    # sequential (default) | parallel_safe (read tools only) | parallel
    parallel_tool_calls: parallel_safe
  # Builtins are packaged but opt-in so existing catalogs stay unchanged.
  builtin_skills_enabled: true

tools:
  builtins:
    - read_file
    - list_directory
    - search_text
    - write_file
    - edit_file
    - run_command

# Optional depth-one subagents for parallel research. Each child has an
# isolated context and receives only tools classified as read; it cannot write,
# execute commands, or spawn another subagent.
delegation:
  enabled: false
  max_concurrency: 3
  request_count: 10
  tool_calls: 20
  timeout_seconds: 180

mcp_servers:
  # Two optional Streamable HTTP examples. Set `required: false` so a
  # transient remote outage becomes a warning instead of a startup failure.
  tyc-mcp:
    transport: streamable_http
    url: https://mcp.tianyancha.com/v1
    headers:
      Authorization: ${TYC_TOKEN}
    defer_tools: true             # default: schema is resolved by tool search
    always_load_tools: []         # raw tool names that must always stay visible
    # Generic dispatch can invoke capabilities beyond a simple lookup, so it
    # stays approval-gated even in auto mode. The remaining tools are reads.
    tool_risks:
      call_tool: execute
      call_tools_batch: execute
      get_company_basic_profile: read
      get_company_capabilities: read
      get_company_group_profile: read
      get_company_people: read
      get_group_info: read
      get_person_profile: read
      get_person_risk_profile: read
      search_bids: read
      search_companies: read
      search_companies_by_industry_region: read
      search_companies_by_ranking: read
      search_companies_by_tag: read
      search_listed_companies: read
      search_patents: read
      search_trademarks: read
    required: false
  exa:
    transport: streamable_http
    url: https://mcp.exa.ai/mcp
    headers:
      x-api-key: ${EXA_API_KEY}
    defer_tools: true
    tool_risks:
      web_fetch_exa: read
      web_search_exa: read
    required: false
    load_resources: true
    load_prompts: true

  # OAuth uses MCP protected-resource discovery + PKCE, persists refreshable
  # credentials as a 0600 JSON file under sessions.directory.
  # github:
  #   transport: streamable_http
  #   url: https://example.com/mcp
  #   oauth:
  #     client_id: ${GITHUB_MCP_CLIENT_ID}
  #     scopes: [repo, read:user]
  #     credential_file: mcp_oauth/github.json
  #   tool_risks:
  #     search_code: read
  #   required: false

# Hooks run without a shell. Context is JSON on stdin; exit 0 allows, exit 2
# denies, and JSON stdout can modify args/result/prompt. See docs/hooks/README.md.
# hooks:
#   - event: pre_tool_use
#     matcher: run_command
#     command: [bash, .lumen/hooks/block-dangerous.sh]
#   - event: post_tool_use
#     matcher: write_file
#     module: my_hooks.autoformat
#     factory: hook

permissions:
  # manual | accept_edits | plan | auto (legacy "ask" is accepted as manual)
  default_mode: manual
  always_allow: []
  always_deny: []

sessions:
  directory: .lumen/sessions

context:
  enabled: true
  soft_ratio: 0.80
  hard_ratio: 0.92
  target_ratio: 0.55
  # soft_token_limit / keep_recent_tokens 仍兼容，但会产生弃用提示；
  # recent 上限可在 agent.models.<name>.context.keep_recent_tokens 覆盖。
  summary_max_tokens: 2000
  background_compaction: true
  background_trigger_ratio: 0.90

# Explicit recall is enabled; automatic extraction is opt-in and makes no
# background model calls while learn=false.
memory:
  use: true
  learn: false
  external_context: exclude
  min_session_turns: 4
  idle_seconds: 120
  max_attempts: 5
  retry_base_seconds: 2
