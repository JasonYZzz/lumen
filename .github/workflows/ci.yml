name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality and generated contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install core and development dependencies (no extras)
        run: uv sync --frozen --all-groups
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Type check all supported platforms
        run: |
          uv run --frozen pyright --pythonplatform Linux
          uv run --frozen pyright --pythonplatform Darwin
          uv run --frozen pyright --pythonplatform Windows
      - name: Generated contract freshness
        run: uv run --frozen python -m lumen.contracts --check
      - name: Provider catalog freshness
        run: uv run --frozen python scripts/export_provider_catalog.py --check
      - name: Architecture Atlas content freshness
        run: uv run --frozen python scripts/build_architecture_atlas.py --check
      - name: Web retrieval without optional extras
        run: uv run --frozen pytest tests/test_web_fetch.py tests/test_web_search.py

  test:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: macos-latest, python: "3.13"}
          - {os: windows-latest, python: "3.13"}
    steps:
      - uses: actions/checkout@v6
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups --extra web --extra live
      - name: Test
        run: uv run --frozen --extra web --extra live pytest --snapshot-details
      - name: Upload failed visual regression report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ matrix.os }}-${{ matrix.python }}
          path: snapshot_report.html
          retention-days: 7
          if-no-files-found: ignore

  web:
    name: Web contract and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: src/web/pnpm-lock.yaml
      - run: uv sync --frozen
      - run: pnpm install --frozen-lockfile
        working-directory: src/web
      - run: pnpm api:schema:check
        working-directory: src/web
      - run: pnpm test
        working-directory: src/web
      - run: pnpm typecheck
        working-directory: src/web
      - run: pnpm build
        working-directory: src/web
      - run: uv build
