name: macOS Apple Silicon desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/desktop/**'
      - 'src/lumen/**'
      - 'src/web/**'
      - 'scripts/*desktop*'
      - 'scripts/lumen_backend.spec'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v6
      - name: Verify native architecture
        run: test "$(uname -m)" = arm64
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: '0.12.5'
          python-version: '3.13.15'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
      - name: Select Rust
        run: rustup default 1.98.0
      - name: Prepare frontend build tools
        run: corepack enable
      - name: Rust quality
        run: |
          cargo fmt --manifest-path src/desktop/Cargo.toml -- --check
          cargo clippy --locked --manifest-path src/desktop/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path src/desktop/Cargo.toml
      - name: Desktop onboarding tests
        run: |
          pnpm --dir src/web install --frozen-lockfile
          pnpm --dir src/web test src/desktop-bootstrap.test.js
      - name: Build and test app (no Apple credentials required)
        run: python3 scripts/build_desktop.py
      - name: Upload reviewable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-macos-arm64-ad-hoc
          path: |
            src/desktop/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src/desktop/target/aarch64-apple-darwin/release/bundle/dmg/SHA256SUMS.txt
            build/desktop/manifest.json
          if-no-files-found: error
          retention-days: 14
